# example.toml: keep sentence-final periods and raise the number-conversion threshold to five.
# Every key is optional; an empty file uses the built-in defaults.
# Save it at the path printed by `parakit config path`, check it with `parakit config show`, then restart the daemon, which reads the config once at startup.
# Other settings and defaults: config_reference.toml.

[cleaning]
# Keep the single final period that cleanup removes by default.
# Delete this line if you dictate short chat-style messages and prefer no trailing period.
keep_trailing_period = true

# Keep ordinary "four" as a word while converting eligible "five" to 5; other numeric structures follow their own rules.
number_threshold = 5
