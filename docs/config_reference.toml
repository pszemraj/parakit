# config_reference.toml: every accepted TOML key. Form: loadable, using the built-in defaults.
# Commented keys show examples for optional or computed values. Start from [example.toml](example.toml).
# Config location and commands: [configuration](configuration.md#file-location).
# Read once at startup. Restart the daemon after edits.
# Precedence: command-line flags > this file > built-in defaults. Flags below belong to `parakit start` unless stated.
# Unknown keys, wrong types, invalid TOML, and constraints fail load with the config path, except stated startup checks.
# Constraints are checked even for disabled features, unused model settings, and disabled user rules.
# Enum strings are lowercase and case-sensitive, except the language hints below.
# Paths are literal: no ~ or environment expansion. Relative paths use the process working directory.
# Integer keys reject fractions and are limited by TOML's signed 64-bit range and the bounds below.
# Optional paths must be nonempty. No key is deprecated or internal.
# CLI names replace underscores with hyphens. Where offered, boolean --name/--no-name pairs force either value and conflict.
# Environment-only settings: [environment variables](configuration.md#environment-variables).

# ---------- Daemon ----------
# CLI model selection replaces configured selection. Configured conflicts still fail load.
# Config: daemon.model conflicts with daemon.model_preset and daemon.quantize. CLI: --model conflicts with --model-preset and --quantize.
# Daemon keys take matching CLI overrides except transcript_history. Global diagnostics are described under verbose.
# doctor also accepts --paste-mode, --insertion-backend, and --hotkey-backend for that check only.

[daemon]
# path string (optional). Local GGUF, disabling automatic acquisition.
# Unset: use the preset. CLI -m aliases --model.
# See: [file checks and reload paths](running.md#model-cache).
# model = "/path/to/model.gguf"

# "parakeet-v2" | "parakeet-v3" | "qwen3-asr-0.6b" | "qwen3-asr-1.7b" | "parakeet-ultra" | "parakeet-redux" (optional). Preset.
# Unset: parakeet-ultra. `fetch` does not read this key.
# Experimental: Qwen presets. Redux is for testing only. [Acquisition and revisions](running.md#model-presets).
# model_preset = "qwen3-asr-1.7b"

# "q8_0" | "q6_k" (optional). Preset precision, ignored with CLI -m/--model.
# Unset: hosted q8_0. CLI --quantize conflicts with -m/--model.
# Warning: q6_k needs an external quantizer and a large first download. [Preparation](running.md#model-presets).
# quantize = "q6_k"

# "auto" | "cpu" | "gpu". Compute policy, reapplied on every model open.
# See: [selection and unavailable GPUs](running.md#device-selection).
device = "auto"

# integer, 1 to 2147483647 (optional). CPU inference threads in every device mode.
# Unset: half the available logical CPUs, minimum 2 (1 on a single-CPU system). Detection failure uses 2.
# See: [CPU limits and overrides](running.md#first-run).
# threads = 4

# integer idle minutes, 0 to 9223372036854775807 (CLI max 18446744073709551615). 0 keeps the model resident.
# See: [timing, reload failures, and GPU memory](running.md#idle-model-offload).
model_idle_minutes = 10

# "auto" | "ibus" | "x11". Linux insertion transport. Any string is accepted and ignored on other systems.
# See: [selection](linux-desktop.md#insertion-selection-and-recovery).
insertion_backend = "auto"

# "terminal" | "standard" | "direct" (optional). Transcript content policy and legacy paste shortcut.
# Unset: terminal on Linux, standard elsewhere.
# Conflicts with: daemon.insertion_backend = "ibus" in direct mode (Linux startup/doctor, after CLI overrides).
# See: [insertion requirements](running.md#insertion).
# paste_mode = "standard"

# bool. Retain pasted text instead of restoring the prior clipboard payload.
# Only used when: clipboard insertion. [Recovery and competing copies](running.md#clipboard-staging-and-restore).
keep_transcript_clipboard = false

# bool. Play dictation cues independently of --quiet.
# See: [cue timing and playback failures](running.md#logging-and-sounds).
sounds = true

# bool. Enable [diagnostics](running.md#first-run) for start, doctor, and rules. Global --verbose enables them and --quiet wins.
verbose = false

# integer in [0, 100]. Retained transcripts in memory, cleared on stop.
# 0 disables history commands and Qwen context. [History and copying](running.md#daemon-control).
transcript_history = 10

# ---------- Qwen ----------
# Validated for every model but used only by Qwen3-ASR. Explicit Qwen CLI flags require a Qwen model.
# --qwen-language and --qwen-max-new-tokens override the first two settings. Context controls have no CLI flags.
# See: [context selection and fallback](models/qwen3-asr.md#prior-dictation-context).

[qwen]
# string. Source language, or auto for detection. Codes and English names ignore case and surrounding whitespace.
# Codes ar-fr: ar/Arabic, cs/Czech, da/Danish, de/German, el/Greek, en/English, es/Spanish, fa/Persian, fi/Finnish, fil/Filipino, fr/French.
# Codes hi-pt: hi/Hindi, hu/Hungarian, id/Indonesian, it/Italian, ja/Japanese, ko/Korean, mk/Macedonian, ms/Malay, nl/Dutch, pl/Polish, pt/Portuguese.
# Codes ro-zh: ro/Romanian, ru/Russian, sv/Swedish, th/Thai, tr/Turkish, vi/Vietnamese, yue/Cantonese, zh/Chinese.
# Empty or unsupported hints, including regional codes such as en-US, fail load.
language = "auto"

# integer, 1 to 4096 generated tokens per native chunk, including EOS.
# See: [budget exhaustion and long audio](models/qwen3-asr.md#long-audio-and-inference).
max_new_tokens = 512

# bool. Request context on the original shortcut, leaving the extra context shortcut inactive.
context_on_default_hotkey = false

# nonnegative integer. Prior dictations to use, limited by daemon.transcript_history. 0 disables context.
context_dictations = 3

# integer, 1 to 307445734561825860. Maximum context age in minutes, evaluated at inference (must fit in seconds).
context_max_age_minutes = 10

# ---------- Cleaning ----------
# --cleaning/--no-cleaning override enabled. --cleaning-profile overrides profile (`rules --profile`).
# `rules list` and `rules test` always list or apply rules, regardless of cleaning.enabled.

[cleaning]
# bool. Apply built-in and user rules. false preserves raw model text, useful for multilingual dictation.
enabled = true

# "safe" | "aggressive". Cleanup tier, independent of user rules.
# See: [profile behavior](cleaning-rules.md#profiles). CLI profile values accept either case.
profile = "safe"

# bool. Keep a single final period instead of applying fix-trailing-period.
# Overridden by: --keep-trailing-period/--no-keep-trailing-period (also on rules).
# See: [punctuation](cleaning-rules.md#profiles).
keep_trailing_period = false

# number, finite and 0 or greater (integer or float). Spoken-number conversion cutoff. No CLI flag.
# See: [threshold, adjacent counts, and separate year/version rules](cleaning-rules.md#numbers).
number_threshold = 4

# list of strings. Case-insensitive literal word/phrase exceptions for stutter-safe-words under both profiles. No CLI flag.
# Words, including contractions, may be separated by spaces or tabs. Empty entries, other punctuation, and newlines fail load.
# A word protects all its repeats. A phrase protects only the complete matching span.
repetition_exceptions = []

# list of strings. Exact, case-sensitive, untrimmed rule names. An unknown name fails load.
# Merged as a union with repeatable --disable-rule, which cannot re-enable entries and is checked when building the cleaner.
# Inactive rules are valid no-ops. [Pass inspection](cleaning-rules.md#inspect-and-test).
disabled_rules = []

# ---------- Logging ----------

[logging]
# path string (optional). Directory for plain-text JSONL dictation records.
# Unset: logging is off.
# Overridden by: --log-dir. No CLI flag disables a configured directory.
# See: [file creation, privacy, and write failures](logging.md).
# dir = "/home/user/.parakit/logs"

# ---------- Linux Hotkey ----------

[hotkey]
# "auto" | "desktop" | "ibus" | "x11-global-hotkey" | "x11-listen" | "evdev-proxy-experimental". Linux PTT capture.
# Only used when: Linux. Other systems accept and ignore any string.
# Overridden by: --hotkey-backend.
# Experimental: evdev-proxy-experimental. [Backend behavior and permissions](linux-desktop.md).
backend = "auto"

# ---------- User Rules ----------
# Repeat [[rules.user]] for each regex replacement. The default is no user rules.
# Uncomment the table header with its keys, or they land in the preceding table.
# Entries follow cleaning.enabled, not cleaning.profile. Within each position they run in file order.
# Enabled patterns are compiled once and reused across dictations.
# Changes are logged by rule name and non-overlapping match count. [Log identity](logging.md#transcription-record-fields).

# [[rules.user]]
# string (required). Nonblank name without edge whitespace, unique among user and built-in rule names. Case-sensitive.
# name = "weights-and-biases-to-wandb"
# string (optional). Description displayed by `rules list`, without behavioral effect.
# Unset: blank.
# description = "Map 'weights and biases' to 'wandb'"
# string (required). Nonempty Rust regex (whitespace-only is legal), case-sensitive unless (?i). No lookaround or backreferences.
# Anchors ^/$ match the whole transcript unless (?m). All non-overlapping matches are replaced.
# Escape backslashes twice in TOML basic strings ("\\bword\\b"), or use literal strings ('\bword\b').
# pattern = "(?i)\\bweights and biases\\b"
# string (required). Replacement text, empty to delete. Supports $0, $1, $name, ${name}, and $$ for a dollar sign.
# Warning: missing groups expand to empty. Use ${1}b for group 1 followed by b ($1b names group 1b).
# replacement = "wandb"
# "first" | "standard" | "last". Default: "standard". Placement relative to built-ins.
# first precedes all built-ins. last follows all built-ins, so no later cleanup repairs its output.
# standard runs before fix-space-before-punct even when disabled. [Order](cleaning-rules.md#rule-order).
# position = "standard"
