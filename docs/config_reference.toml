# config_reference.toml: every key parakit accepts in config.toml, with its type, default, and behavior.
# Form: loadable. This file is itself a valid config.toml, and loading it gives exactly the built-in defaults.
# An uncommented key is set to its literal default.
# A commented-out key has no literal default (it is unset, depends on the platform, or is computed), and the value shown is only an example.
# To start a config of your own, copy example.toml. Use this file to look keys up.
# Tests keep this file in step with the program, so it cannot silently go stale.
# src/config_reference_tests.rs fails when a key is added to or removed from the schema without being documented here, when this file does not load, when a value set here differs from the program default, and when a closed set of values drifts.
# src/rules/tests/config_reference.rs does the same for the built-in rule inventory below.
#
# Location: the path printed by `parakit config path`.
# If PARAKIT_CONFIG_PATH is set, it is used verbatim. An empty value is an error, and a relative path stays relative to the working directory.
# Otherwise Linux and macOS use $XDG_CONFIG_HOME/parakit/config.toml, falling back to $HOME/.config/parakit/config.toml when XDG_CONFIG_HOME is unset or empty.
# Otherwise Windows uses parakit\config.toml inside the Roaming AppData folder, normally %APPDATA%\parakit\config.toml.
# A missing file is not an error: every key takes its built-in default.
# A mistyped PARAKIT_CONFIG_PATH therefore also silently gives defaults. `parakit config show` prints `exists: false` in that case.
#
# Precedence, highest first: a command-line flag, this file, the built-in default.
# The flags named on each key belong to `parakit start` unless stated otherwise. A bare `parakit` is `parakit start` with no flags, so it cannot take them.
# Exceptions are stated on the key: the boolean pairs can be forced either way from the command line, and cleaning.disabled_rules is merged with its flag instead of being replaced.
#
# Unknown keys are rejected at every level: at the top level, in every table, and inside every [[rules.user]] entry.
# An unknown key, invalid TOML, a wrong type, an unknown enum string, or a failed validation is a hard error that names the config file.
# Enum strings are lowercase and case-sensitive.
#
# When it is read: once per process, at startup. The daemon never watches the file, so restart it after every edit.
# These commands read the file: `parakit start` (and bare `parakit`), `parakit doctor`, `parakit rules list`, `parakit rules test`, and `parakit config show`.
# Each of them reads the current file on every run, so `rules test` and `config show` check an edit before the daemon is restarted.
# These commands never read it, so they work with a broken file: `parakit fetch`, `cache`, `status`, `stop`, `copy-last`, `history`, `test-paste`, and `config path`, `init`, `edit`.
# A second `parakit start` while a daemon is already running prints "already running" and exits before it reads the file.
#
# Value conventions: paths are used literally, with no ~ and no environment-variable expansion.
# A relative path resolves against the working directory of the process that reads it, not against the directory of this file.
# A whole-number key needs a TOML integer. A fraction such as 1.5 is rejected.
# `parakit config show` prints the effective value of every key, merged with the built-in defaults but not with command-line flags.
# `parakit config init` writes a commented template with the same keys, and `parakit config edit` opens the file in $VISUAL or $EDITOR.
#
# No key is deprecated or internal. The value "evdev-proxy-experimental" of hotkey.backend is experimental.
# The environment variables that parakit reads are listed at the end of this file. They are not config keys.


# ---------- [daemon]: model, device, insertion, and daemon behavior ----------

[daemon]
# path string (optional). Path to the GGUF speech-model file that the daemon loads.
# Unset: the daemon uses the hosted Q8_0 model, parakeet-tdt-0.6b-v3-Q8_0.gguf, in the model cache directory (see PARAKIT_MODELS_DIR at the end of this file), and downloads it at startup when it is missing.
# Overridden by: the -m/--model flag. When the flag is given, the path in this key is never checked for a file or used, so a wrong path here is harmless.
# An empty string fails config load with "daemon.model is set but empty", even when -m is given.
# An empty -m or --model value is a command-line parse error.
# The file must exist and be a regular file (a symlink to one is fine). Otherwise startup fails with "model path is not a file".
# This check runs right after the config loads, before the hotkey and microphone checks.
# The path must also be valid UTF-8, or startup fails with "model path is not valid UTF-8" when the model is opened.
# The contents are not checked until the model is opened. A file that is not a usable Parakeet GGUF fails then with "could not open model".
# A relative path resolves against the working directory of the daemon process at startup. It is converted to an absolute path once, and that path is reused for every idle reload.
# Setting this key turns off the automatic download. Models fetched with `parakit fetch <repo-or-url>` are never used unless they are named here or with -m.
# `parakit doctor` does not check this key.
# model = "/path/to/model.gguf"

# "auto" | "cpu" | "gpu". Where speech recognition runs.
# "auto" uses the best GPU when one is available and the CPU otherwise. The daemon banner and `parakit --verbose status` show which one was chosen.
# "cpu" never uses a GPU.
# "gpu" requires a GPU. In the default build (Cargo feature `bundled`), startup fails before the model is fetched or opened when ggml reports no GPU or iGPU device.
# That startup message, and the failed-reload message below, name the value as device "gpu" (from --device or daemon.device), because either one can set it.
# In a build without the `bundled` feature (an external libcrispasr) there is no device probe. Startup only warns and still opens the model with the GPU requested, and the CrispASR library decides what happens without one.
# Overridden by: the --device flag.
# Only used when: the model is opened. The policy is applied again on every idle reload (see daemon.model_idle_minutes).
# On a reload, "auto" loads on the CPU until the next offload when free GPU memory is below the model file size plus 1 GiB, and says so in a warning and a desktop notification. "gpu" fails that reload instead.
# Recommended: "auto".
device = "auto"

# integer, 1 or more (optional). Number of CPU threads used for inference. The value is passed to the engine in every device mode.
# Unset: computed from the number of logical CPUs the process may use. One CPU gives 1 thread, otherwise half the CPUs with a minimum of 2.
# If the CPU count cannot be detected, 4 is assumed, which gives 2 threads. Examples: 4 CPUs give 2 threads, 8 give 4, 16 give 8.
# Under a container CPU quota or a CPU affinity mask the process may see fewer CPUs than the machine has.
# Overridden by: the --threads flag.
# 0, negative values, and non-integers fail config load.
# A value above 2147483647 loads, but opening the model then fails with "thread count is too large for CrispASR" in every device mode.
# Warning: an explicit value is not clamped to the CPU count, so a large value oversubscribes the machine.
# On Windows, every time the model is opened (at startup and on each idle reload), parakit sets OMP_NUM_THREADS to the effective thread count, OPENBLAS_NUM_THREADS to 1, and OMP_WAIT_POLICY to PASSIVE in its own environment.
# A variable that is already set, even to an empty string, is left alone. Linux and macOS are not touched.
# threads = 4

# integer, 0 to 9223372036854775807. Minutes of uninterrupted idleness after which the daemon releases the speech model from memory. 0 disables offloading, so the model stays loaded.
# Idle time uses a monotonic clock. It starts when the daemon becomes ready and restarts each time work finishes. Whether time spent in system sleep counts depends on the operating system.
# Recording, queued dictations, transcription, text insertion, `parakit copy-last`, and `parakit test-paste` count as activity. `parakit status`, `history`, and `stop` do not.
# After an offload, pressing the push-to-talk key reloads the model while audio is already being recorded. A three-note cue plays, then the normal listening tone once the model is ready if the key is still held.
# If the key is released first, the audio is queued until the model is ready.
# A reload never downloads anything. It uses the absolute model path, the thread count, and the device policy fixed at startup.
# If a reload fails (the model file was deleted or moved, or daemon.device is "gpu" and GPU memory is short), the error cue plays and a "Model unavailable" notification appears.
# The reload is retried once when the key is released. If that also fails, the dictation is discarded without inserting anything ("Dictation discarded"), and the next key press tries again.
# Overridden by: the --model-idle-minutes flag. An explicit flag value of 0 wins over a nonzero value here.
# Negative values, fractions, non-integers, and integers above 9223372036854775807 fail config load. The flag accepts integers up to 18446744073709551615.
# A huge value is not rejected at runtime: the model simply never offloads.
# Recommended: 0 when you share the GPU with other programs and use daemon.device "gpu", because another program can take the freed GPU memory and make the reload fail.
# Recommended: 0 also when the reload delay after a pause is unwelcome. Keep 10, or another value, to free memory during long idle periods.
model_idle_minutes = 10

# "terminal" | "standard" | "direct" (optional). How a finished transcript is inserted at the cursor.
# Unset: "terminal" on Linux, "standard" on macOS and Windows.
# "terminal" pastes from the clipboard with Ctrl+Shift+V on Linux and Windows and Cmd+V on macOS. Trailing newlines are removed.
# In "terminal" mode a transcript that still contains a newline is not pasted. It is staged on the clipboard instead (see daemon.keep_transcript_clipboard), with an error tone and a notification.
# "standard" pastes from the clipboard with Ctrl+V on Linux and Windows and Cmd+V on macOS. Multi-line text is pasted.
# "direct" types the text with synthetic key events and never touches the clipboard. daemon.keep_transcript_clipboard has no effect in this mode.
# On Linux, "direct" blocks a whole transcript that contains a newline, a tab, or another control character after the normalization below, and types nothing.
# On Linux, "direct" typing waits up to 2 seconds for held modifier keys to be released, and stops partway if focus or modifier state changes.
# Every mode first normalizes the transcript: CRLF and CR become LF, NUL and the other ASCII control characters except tab and LF are dropped.
# A transcript that is whitespace-only after normalization is skipped: nothing is pasted or stored in the transcript history, and the error tone plays.
# Requires: on Linux, an X11 session for every mode (Wayland is rejected at startup), plus the X11 XTest extension for the two paste modes.
# Requires: on macOS, Accessibility permission for every mode.
# Overridden by: the --paste-mode flag. `parakit doctor --paste-mode` overrides this key for that one check only.
# paste_mode = "standard"

# bool. Whether the dictated text stays on the clipboard after it is pasted.
# false: after a confirmed paste, the previous clipboard contents (text, HTML, file lists, images) are restored after a short delay.
# If the previous contents are not a payload parakit can restore, the clipboard is cleared rather than left holding the transcript.
# true: the transcript stays on the clipboard, and the previous contents are neither read nor restored.
# Only used when: daemon.paste_mode is "terminal" or "standard". It is ignored with "direct", which never uses the clipboard.
# Overridden by: the --keep-transcript-clipboard and --no-keep-transcript-clipboard flags, which force the value either way and conflict with each other.
# The transcript is left on the clipboard whatever this key says in three cases.
# First, on Linux and macOS, when the modifier keys are still held after waiting 2 seconds. The text is staged for you to paste by hand.
# Second, on macOS, when the paste could not be confirmed.
# Third, when the previous clipboard could not be read, or changed while it was being saved.
# A transcript that terminal mode refuses (it is multi-line), or whose paste was blocked because focus changed or the paste backend was unavailable, is staged on the clipboard.
# With false the previous clipboard is restored afterwards and the insertion is logged as "blocked". With true the transcript stays and the insertion is logged as "copied_only".
# With true, if the paste keystroke itself fails, the transcript is also copied to the clipboard.
# Warning: parakit never overwrites a clipboard that changed behind its back. If the clipboard no longer holds the staged transcript when the restore would run, the restore is skipped and the newer contents are kept.
# Warning: on macOS and Windows, a competing clipboard write seen after staging also cancels the paste.
keep_transcript_clipboard = false

# bool. Play short tones for dictation events.
# The cues are a start tone when listening begins (only if the key is still held), a three-note cue while the model reloads after an idle offload, a success tone after insertion, and a two-tone error cue.
# The error cue plays for a silent capture, a failed reload, a failed transcription, or an insertion that was blocked, skipped, or only copied.
# Overridden by: the --sounds and --no-sounds flags, which force the value either way and conflict with each other.
# The global --quiet flag does not silence the cues.
# If a cue cannot be played, `parakit: sound cue dropped: <error>` is written to stderr, which --quiet does not suppress, and dictation continues.
# Cues that pile up faster than they play are dropped.
sounds = true

# bool. Print diagnostics: model path, microphone and backend details, timings, clipboard diagnostics, and the native inference library's own log messages. Without it only that library's warnings and errors are shown.
# Overridden by: the global --quiet flag, which always wins.
# The global --verbose flag turns diagnostics on whatever this key says. The effective value is on when either is set and --quiet is absent.
# Applies to `parakit start`, to `parakit doctor` (detailed instead of summary output), and to `parakit rules` (native-library log filter only).
# It does not apply to fetch, cache, config, status, stop, copy-last, history, or test-paste. Pass --verbose to those.
# `parakit status` detail depends only on the --verbose flag given to that status command.
# Without diagnostics, a model that fails to load reports an error that suggests rerunning with --verbose.
verbose = false

# integer, 0 to 100. How many recent transcripts the daemon keeps in memory for `parakit copy-last` and `parakit history`, newest first.
# 0 disables both commands: they fail with "transcript history is disabled (daemon.transcript_history = 0)", and `parakit status` reports "last transcript: history disabled".
# The history exists only in daemon memory. It is cleared when the daemon stops and is never written to disk by this key.
# Every transcript that reaches insertion is remembered, including one whose paste was blocked or failed. A transcript skipped as whitespace-only is not.
# logging.dir is independent: it can persist the same transcripts to disk.
# Values above 100, negative values, and non-integers fail config load. There is no command-line flag.
transcript_history = 10


# ---------- [cleaning]: transcript cleanup ----------

[cleaning]
# bool. Run the cleaning pipeline on each transcript. false inserts the model's raw transcript unchanged: no built-in rule and no [[rules.user]] entry runs.
# Overridden by: the --cleaning and --no-cleaning flags, which force the value either way and conflict with each other.
# Validation still happens when false: cleaning.disabled_rules, cleaning.number_threshold, and every [[rules.user]] entry (including each regex) must be valid or the config fails to load.
# `parakit rules test` and `parakit rules list` ignore this key and always apply or list the rules.
enabled = true

# "safe" | "aggressive". Cleanup tier.
# "safe" runs mechanical cleanup and high-confidence normalization.
# "aggressive" additionally runs the rules marked aggressive in the inventory below.
# Five of those delete discourse markers such as filler "like", "you know", and "I mean", which can change meaning. One collapses repeats of that, no, can, had, and do.
# Does not gate [[rules.user]] entries, which run under both profiles.
# Only used when: cleaning.enabled is true. The value is still validated otherwise.
# Overridden by: the --cleaning-profile flag of `parakit start`. On `parakit rules list` and `parakit rules test` the flag is --profile.
# Only lowercase is accepted in this file ("Safe" fails config load), while the command-line flags accept any case.
# Recommended: "safe", unless you want discourse markers deleted and accept that it can change meaning.
profile = "safe"

# bool. Keep the single final period of a transcript. false removes it, which suits messaging-style dictation. Only one period is removed, so "wait..." ends in "..".
# This is the built-in rule fix-trailing-period. It is in the pipeline only when this key is false and the rule is not named in cleaning.disabled_rules.
# Disabling that rule by name has the same visible effect as setting this key to true.
# Only used when: cleaning.enabled is true.
# Overridden by: the --keep-trailing-period and --no-keep-trailing-period flags, which force the value either way and conflict with each other. The same pair exists on `parakit rules list` and `parakit rules test`.
keep_trailing_period = false

# number, 0 or more (integer or float). Decides which spoken numbers the spoken-numbers rule turns into digits.
# Only isolated single-digit numbers ("zero" to "nine") and isolated ordinals ("first", "twenty first") are compared with the threshold.
# One whose value is below the threshold is left exactly as the model produced it, neither forced to words nor to digits. One at or above it becomes digits.
# Cardinal numbers of 10 or more are converted at any threshold. So is a number listed next to other numbers: "Zero, one, two, three, four." becomes "0, 1, 2, 3, 4" at the default.
# Example: with 5, "four apples" and "two apples" stay as written and "five apples" becomes "5 apples". With the default 4, zero through three stay as written.
# 0 converts every recognized isolated number. Protections still apply at 0: a run of adjacent small numbers ("one two three"), plural magnitudes, fractions, and the time unit "second" stay as words.
# The effective default is 4, applied when the key is absent. An explicit 0 is a different setting from absent.
# Negative, infinite, and NaN values fail config load with "number threshold must be a finite value greater than or equal to 0".
# Only used when: cleaning.enabled is true and the spoken-numbers rule is not disabled. The value is validated either way.
# The structural number rules (spoken-version-numbers, numeric-point-suffixes, compact-parameter-counts, and the other numeric rules) do not read it.
# There is no command-line flag. `parakit rules test` honors this key, and `parakit rules list` does not use it.
number_threshold = 4

# list of strings. Names of rules to turn off. A name is a built-in rule from the inventory below or a [[rules.user]] entry.
# Each name is matched exactly, case-sensitively and without trimming.
# An unknown name fails config load with "no rule named '<name>'", even when cleaning.enabled is false.
# The name of a rule that is not active under the current profile is valid, and disabling it does nothing.
# A disabled [[rules.user]] entry must still have a valid name and a regex that compiles.
# The --disable-rule flag (repeatable) is merged with this list as a union without duplicates. No flag can re-enable a rule disabled here.
# Names given by the flag are checked only when the cleaner is built (daemon start, `rules list`, `rules test`), not by `parakit config show`.
# Naming fix-trailing-period here has the same visible effect as cleaning.keep_trailing_period = true.
# Naming spoken-numbers here makes cleaning.number_threshold inert, though the threshold is still validated.
# Disabling a built-in rule changes the rule-set id recorded in transcription logs.
# Built-in rule inventory, in the order the rules run and `parakit rules list` prints them.
# The tier in parentheses is the tier column of `parakit rules list`. "safe" rules are always on, "aggressive" rules run only when cleaning.profile is "aggressive", and "messaging-default" runs only while cleaning.keep_trailing_period is false.
#   lead-discourse-comma (aggressive): remove comma-delimited discourse markers at the start of the text or of a sentence.
#   lead-discourse-word (aggressive): remove a leading so, well, or like before a common continuation.
#   mid-like-discourse (aggressive): remove comma-delimited "like" followed by "you know" or "I mean" filler.
#   mid-discourse-parenthetical (aggressive): remove fully comma-delimited discourse phrases such as "you know", "I mean", "like", and "I don't know".
#   mid-filler-like (aggressive): remove "like" used as filler after a recognized context or a comma.
#   filled-pauses (safe): remove standalone um, uh, and erm variants (uh, um, uhh, umm, uhm, erm, errm) and the commas next to them.
#   stutter-i (safe): collapse a run of two or more "I" into one uppercase "I".
#   stutter-safe-words (safe): collapse repeats of high-confidence function words such as the, a, and, to, of, we, you, it.
#   contracted-have-restart (safe): remove the repeated subject from a restart such as "I've I've" (subjects I, we, you, they).
#   stutter-ambiguous-words (aggressive): collapse repeats of that, no, can, had, and do.
#   repeated-prefix-stutter (safe): remove a repeated one-letter or consonant-digraph start before the word it begins.
#   spaced-acronyms (safe): join runs of standalone uppercase ASCII letters separated by single spaces ("A P I" becomes "API").
#   spoken-version-numbers (safe): render multi-point spoken versions ("one point two point three") as digits.
#   numeric-point-suffixes (safe): append spoken point parts to an existing number.
#   spoken-numbers (safe): convert spoken English numbers to digits, keeping large magnitudes as words, subject to cleaning.number_threshold.
#   compact-parameter-counts (safe): render parameter counts with K, M, or B suffixes.
#   numeric-identifier-groups (safe): join split digit groups in uppercase identifiers.
#   numeric-magnitude-suffixes (safe): join a number to an uppercase K, M, or B suffix.
#   compact-version-prefix (safe): join a standalone V or v to a following dotted version, producing a lowercase "v".
#   compact-short-identifier (safe): join one uppercase letter, or the stem SM, to a following number.
#   cause-to-because (safe): turn the apostrophe form 'cause into "because".
#   casual-em-til-round (safe): separate attached 'em, 'til, 'round, 'bout, 'cept, and 'nother.
#   casual-gonna (safe): expand gonna and gunna to "going to".
#   casual-gotta (safe): expand gotta to "got to".
#   casual-wanna (safe): expand wanna and wana to "want to".
#   casual-kinda (safe): expand kinda to "kind of".
#   casual-gimme (safe): expand gimme to "give me".
#   drop-right-tag-question (safe): replace a ", right?" tag question with a period.
#   drop-dangling-connective (safe): remove a trailing so, but, and, or, or because, promoting a comma, semicolon, or colon before it to a period.
#   fix-space-before-punct (safe): remove whitespace (including newlines) before , . ; : ! or ?.
#   fix-collapse-spaces (safe): collapse runs of spaces and tabs.
#   fix-trim (safe): trim leading and trailing whitespace.
#   fix-leading-comma (safe): remove one comma left at the start.
#   capitalize-sentence-starts (safe): capitalize sentence starts, leaving tokens that contain "." or "@", URLs, and tokens with inner capitals alone.
#   fix-trailing-period (messaging-default): remove one final ".".
disabled_rules = []


# ---------- [logging]: transcription log ----------

[logging]
# path string (optional). Directory for JSONL transcription logs: one record per dictation (raw and cleaned text, cleaning metadata, timings) and one per insertion attempt (outcome and clipboard telemetry).
# Unset: transcription logging is off.
# Overridden by: the --log-dir flag. No flag turns a configured directory off.
# Files are named parakit-YYYY-MM-DD.jsonl by local date and are appended to, one file per day. parakit never rotates or deletes them.
# The directory is created on the first write, so neither `parakit config show` nor daemon startup can prove it is writable.
# A write failure prints `parakit: transcription log write failed: ...` (or `insertion log write failed`) to stderr, which --quiet does not suppress. Dictation continues, and the next dictation tries again.
# Silent or no-speech captures and failed transcriptions are not logged. Audio is never logged.
# This is independent of daemon.transcript_history, which keeps recent transcripts in daemon memory only.
# An empty string fails config load with "logging.dir is set but empty".
# An empty --log-dir value is a command-line parse error.
# Warning: the log holds the raw and cleaned dictated text in plain text.
# dir = "/home/user/.parakit/logs"


# ---------- [hotkey]: Linux push-to-talk capture ----------

[hotkey]
# "auto" | "desktop" | "x11-global-hotkey" | "x11-listen" | "evdev-proxy-experimental". Which mechanism captures the push-to-talk chord, Ctrl+Space, on Linux. It selects the capture mechanism, not the chord.
# Linux only. macOS and Windows accept this key so that one config file works everywhere, but they never read it and do not validate its value: any string loads there.
# On Linux an unknown name fails config load.
# "auto", "desktop", and "x11-global-hotkey" currently behave identically: Ctrl+Space is registered as an X11 global hotkey.
# If registration fails, for example because another application already owns Ctrl+Space, startup fails. "auto" does not fall back to another backend.
# "x11-listen" passively watches X11 key events. It grabs and suppresses nothing, so Ctrl+Space still reaches the focused application.
# Experimental: "evdev-proxy-experimental" grabs every readable /dev/input event device that has both a Space key and a Ctrl key (devices already grabbed elsewhere are skipped) and re-emits their input through /dev/uinput.
# Requires: for "evdev-proxy-experimental", read access to /dev/input and write access to /dev/uinput. `parakit doctor` checks both. The backend logs a warning at startup because it grabs devices.
# Text insertion and the daemon still require X11, so it does not make Wayland supported.
# Warning: do not run parakit with sudo to get those permissions. Audio, the clipboard, and text insertion must stay in the desktop-user session.
# Machine availability is not checked at config load. Run `parakit doctor`. Daemon startup performs the final check.
# If the hotkey loop fails while the daemon runs, the daemon exits with code 2.
# Overridden by: the --hotkey-backend flag (Linux only). `parakit doctor --hotkey-backend` overrides this key for that one check only.
backend = "auto"


# ---------- [[rules.user]]: your own cleaning rules ----------

# Each [[rules.user]] table is one regex replacement applied to every transcript alongside the built-in rules. Repeat the header for each rule. The default is no user rules.
# The example entry below is commented out. Uncomment the [[rules.user]] header together with its keys, or the keys land in the preceding table.
# Entries run only through the cleaning pipeline, so they follow cleaning.enabled, and they are never gated by cleaning.profile. Within one position they run in file order.
# Every entry is validated when the config loads. Every enabled entry's regex is compiled once at daemon startup and reused for every dictation.
# An invalid entry makes every command that reads the config fail with an error that names the config file and the rule.
# A rule that changes the text is recorded with its name and its count of non-overlapping matches in the transcription log and in the "Rules:" line of `parakit rules test`.
# The name, pattern, replacement, position, and order of enabled entries are part of the rule-set id recorded in transcription logs. A description and disabled entries are not.

# [[rules.user]]
# string (required). Identifier of the rule. It is the name that cleaning.disabled_rules and --disable-rule take, and the name `parakit rules list` shows.
# It must not be empty or whitespace-only, must have no leading or trailing whitespace, must differ from every built-in rule name, and must be unique among user rules. Names are case-sensitive.
# name = "weights-and-biases-to-wandb"
# string (optional). Human-readable description. Any string, including an empty one.
# Unset: `parakit rules list` shows a blank description. The description is shown nowhere else and does not affect behavior.
# description = "Map 'weights and biases' to 'wandb'"
# string (required). Regular expression to match, in the syntax of the Rust `regex` crate: no lookahead, lookbehind, or backreferences.
# It is case-sensitive unless it carries (?i). The anchors ^ and $ match the start and end of the whole transcript unless (?m) is set.
# It must not be the empty string. A whitespace-only pattern is legal and matches those characters.
# It must compile. A pattern that does not fails config load even when the rule is listed in cleaning.disabled_rules.
# In a TOML basic string ("...") write every regex backslash twice, as in "\\bword\\b". A TOML literal string ('...') needs no doubling.
# All non-overlapping matches are replaced.
# pattern = "(?i)\\bweights and biases\\b"
# string (required). Replacement text for each match. An empty string is allowed and deletes the match.
# It supports $0, $1, $name, ${name}, and $$ for a literal dollar sign.
# The name after a $ is the longest run of letters, digits, and underscores, so "$1b" means a group named "1b" (which does not exist) and not group 1 followed by "b". Write "${1}b" instead.
# Warning: a reference to a group that does not exist expands to empty text without an error, so a typo silently removes text.
# replacement = "wandb"
# "first" | "standard" | "last". Default: "standard". Where the rule runs relative to the built-in rules.
# "first" runs before every built-in rule.
# "standard" runs immediately before the built-in fix-space-before-punct rule, even when that rule is disabled.
# That is after the number, casual-form, tag-question, and dangling-connective rules, and before the whitespace and punctuation cleanup, capitalization, and terminal-period rules.
# "last" runs after every built-in rule, including capitalize-sentence-starts and fix-trailing-period, so no later cleanup repairs its output.
# Recommended: "standard" for ordinary substitutions.
# position = "standard"


# ---------- Environment variables ----------
#
# These are process environment variables, not config keys, and they cannot be set in this file.
# parakit inherits them from whatever launches it and does not read a .env file.
# Variables that matter only when building from source are outside this reference.

# PARAKIT_CONFIG_PATH
# Path of the config file. Used verbatim when set. Empty is an error. A relative path is relative to the working directory. A path that does not exist gives built-in defaults.
# Read by `start`, `doctor`, `rules`, and every `config` subcommand.

# PARAKIT_MODELS_DIR
# Directory that holds downloaded models. Used verbatim when set. Empty is an error. A relative path is relative to the working directory.
# Default on Linux and macOS: $XDG_CACHE_HOME/parakit/models, or $HOME/.cache/parakit/models. Default on Windows: parakit\Cache\models inside the Local AppData folder.
# Read only by commands that touch the model cache: `fetch`, `cache`, and daemon startup when neither -m nor daemon.model is set. It is not consulted when a model path is given.

# XDG_CONFIG_HOME
# Linux and macOS. Base of the default config path. A relative value is used as given, and an empty value counts as unset. Ignored when PARAKIT_CONFIG_PATH is set.

# XDG_CACHE_HOME
# Linux and macOS. Base of the default model cache, and of the daemon runtime directory where XDG_RUNTIME_DIR does not apply. A relative value is used as given, and an empty value counts as unset.

# HOME
# Linux and macOS. Fallback for XDG_CONFIG_HOME and XDG_CACHE_HOME.
# An empty value counts as unset.
# When it is unset or empty and the XDG variable gives no base, those paths cannot be resolved and the command fails with "HOME is unset or empty".

# XDG_RUNTIME_DIR
# Linux. Directory whose parakit subdirectory holds the daemon lock file (parakit.lock) and control socket (control.sock). An empty value counts as unset.
# Fallback: $XDG_CACHE_HOME/parakit/run, or $HOME/.cache/parakit/run. macOS always uses that fallback. Windows keeps the lock in parakit\run inside Local AppData and talks over a named pipe.
# The control commands (`status`, `stop`, `copy-last`, `history`, `test-paste`) and the daemon must resolve the same directory to find each other.
# The socket directory must be owned by you, and parakit sets it to mode 0700.

# VISUAL
# Editor for `parakit config edit`, tried first. A value that is empty or whitespace-only is ignored, and the command falls through to EDITOR.
# The value is split into a program and arguments with shell-style quoting (for example `code -w`) and run without a shell, with the config path appended. An unmatched quote is an error.

# EDITOR
# Editor for `parakit config edit` when VISUAL is unset or blank, parsed the same way.
# A blank EDITOR is ignored too.
# With neither one set to a nonblank value the command fails and prints the path to edit by hand. If the config file did not exist, the template is written first.

# DISPLAY
# Linux. Must be present for the daemon and for the X11 checks of `parakit doctor`. parakit checks only that it is set. Whether it is usable is decided when the X11 connection opens.
# Inherit it from the desktop session.

# XDG_SESSION_TYPE
# Linux. A value of "wayland" in any case stops daemon startup, because Wayland is not supported.
# An empty value counts as present, so it also disables the WAYLAND_DISPLAY fallback below.

# WAYLAND_DISPLAY
# Linux. Consulted only when XDG_SESSION_TYPE is absent. A nonempty value is then treated as Wayland and stops daemon startup.

# XAUTHORITY
# Linux. Only reported by `parakit doctor --verbose` and by startup failure messages. parakit makes no decision from it. The X11 libraries read it themselves.

# USER
# Linux. Only fills in the user name in the permission fix shown for the evdev-proxy-experimental backend. It has no other effect.

# OMP_NUM_THREADS
# Windows. Set by parakit to the effective daemon.threads value unless it is already set to anything, including an empty string.

# OPENBLAS_NUM_THREADS
# Windows. Set by parakit to 1 unless it is already set to anything, including an empty string.

# OMP_WAIT_POLICY
# Windows. Set by parakit to PASSIVE unless it is already set to anything, including an empty string.

# HF_ENDPOINT
# Base URL that replaces https://huggingface.co for the default model download, `parakit fetch <repo>`, and `parakit fetch --from-source`. This includes the download the daemon runs at startup when no model is set.
# A blank value means the default. Trailing slashes are trimmed. It does not apply to `parakit fetch <url>`.

# HF_TOKEN
# Bearer token sent to the Hugging Face endpoint (HF_ENDPOINT or the default) for those downloads. Blank means none. It is never sent for a direct URL fetch.

# HTTPS_PROXY, HTTP_PROXY, ALL_PROXY, NO_PROXY
# Read by the HTTP client library (reqwest's system-proxy support), in upper and lower case, for model downloads. They affect `fetch` and the automatic download only.

# SSL_CERT_FILE, SSL_CERT_DIR
# Read by the TLS library for additional trusted certificates when downloading models.

# PATH
# `parakit fetch --from-source` searches it for python3 or python, and for the crispasr-quantize tool when it is not at the location built into the binary.
# `parakit config edit` relies on it to find the editor program.

# LD_LIBRARY_PATH, DYLD_LIBRARY_PATH
# LD_LIBRARY_PATH on Linux and DYLD_LIBRARY_PATH on macOS. For a quantizer that ships with its own lib directory, `fetch --from-source` prepends that directory to the existing value for the quantizer child process only.
# On Windows the same prepending is done to PATH.
